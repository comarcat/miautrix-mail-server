<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Miautrix Mail — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Red+Hat+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="login-page">
  <form class="login-card" method="post" action="#" novalidate>
    <img class="login-logo" src="assets/miautrix-logo.png" alt="Miautrix — Secure Email Platform"/>

    <div class="login-field">
      <label for="email">Email Address</label>
      <div class="login-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>
        </svg>
        <input id="email" name="email" type="email" autocomplete="username"
               placeholder="admin@example.miautrix.com" required/>
      </div>
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <div class="login-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••••" required/>
      </div>
    </div>

    <div class="login-row">
      <a href="#">Forgot Password?</a>
    </div>

    <button class="login-cta" type="submit">Sign In</button>

    <p class="login-alt"><a href="#">Sign Up</a></p>
  </form>
</div>
</body>
</html>
